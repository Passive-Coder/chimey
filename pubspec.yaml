name: chimey
description: An audio-reactive ambient sound UI prototype.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.10.7
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  record: ^6.2.1
  shared_preferences: ^2.5.5
  http: ^1.6.0
  url_launcher: ^6.3.2
  flutter_widget_from_html_core: ^0.17.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVariable.ttf
  shaders:
    - shaders/aurora.frag
